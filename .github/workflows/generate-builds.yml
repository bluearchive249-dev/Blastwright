name: generate-builds
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    needs: generate-soh-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Macports
      uses: melusina-org/setup-macports@v1
      with:
        parameters: '.github/macports.yml'
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }} # ccache-macos-{{ timestamp }}
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        set -o pipefail
        cmake --build build-cmake -j 2>&1 | tee build.log
        # Spotlight indexing the disk image CPack just made keeps hdiutil from
        # unmounting it, failing the build with "Resource busy"
        sudo mdutil -a -i off || true
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        # The job logs aren't always reachable, so the compiler errors also go into an annotation
        if [ -f build.log ]; then
          msg=$(grep -E -i -A4 "error|undefined reference|unresolved external|FAILED:" build.log | grep -v -i "werror\|-Wno-error" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"
        fi
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-mac
        path: |
          SoH.dmg
          readme.txt

  build-linux:
    needs: generate-soh-otr
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.ref }}
          ${{ runner.os }}-${{ matrix.arch }}-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-${{ matrix.arch }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-deps-${{ github.ref }}-
          ${{ runner.os }}-${{ matrix.arch }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/${{ matrix.arch }}-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/${{ matrix.arch }}-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Install libzip without crypto
      run: |
        sudo apt-get remove -y libzip-dev
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/${{ matrix.arch }}-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        set -o pipefail
        cmake --build build-cmake --config Release -j4 2>&1 | tee build.log
        (cd build-cmake && cpack -G External)

        mv build-cmake/*.appimage soh.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        # The job logs aren't always reachable, so the compiler errors also go into an annotation
        if [ -f build.log ]; then
          msg=$(grep -E -i -A4 "error|undefined reference|unresolved external|FAILED:" build.log | grep -v -i "werror\|-Wno-error" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"
        fi
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-linux-${{ matrix.arch }}
        path: soh.appimage
    - name: Save Cache deps folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        # (no evicting files this run didn't use: a build that fails early would save an emptied cache, and the next
        # one compiles everything again; the size cap keeps it trimmed)
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    # vcpkg with its built libraries, kept between builds: without it every build downloads and compiles all of them
    # again (half the build's time, and a GitHub hiccup on any download fails the build)
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-v3-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-v3-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}-
          ${{ runner.os }}-vcpkg-v3-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build SoH
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
        # Downloads go through our fetcher (GitHub's commit patches often fail with 503 on build machines), and a
        # vcpkg restored from the cache stays as it is (no update: its built libraries stay valid)
        X_VCPKG_ASSET_SOURCES: x-script,"C:\Program Files\Git\bin\bash.exe" ${{github.workspace}}/.github/scripts/vcpkg-fetch.sh {url} {sha512} {dst}
        AUTOMATE_VCPKG_NO_UPDATE: 1
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        # vcpkg fetches some patches straight from github.com, which often answers 503 to build machines: retry the
        # configure (what's already built is kept) until those downloads go through
        $ok = $false
        for ($i = 1; $i -le 6; $i++) {
          cmake -S . -B build-windows -G Ninja -DVCPKG_ROOT="${{github.workspace}}/vcpkg" -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1 2>&1 | Tee-Object -FilePath "configure$i.log"
          $code = $LASTEXITCODE
          Get-Content "configure$i.log" | Add-Content build.log
          $failed = ($code -ne 0) -or (Select-String -Path "configure$i.log" -Pattern "BUILD_FAILED" -Quiet)
          if (-not $failed) { $ok = $true; break }
          if (-not (Select-String -Path "configure$i.log" -Pattern "curl operation failed|Download failed" -Quiet)) { break }
          Write-Host "::warning::A vcpkg download failed (GitHub busy), retrying in $(45 * $i) s"
          Start-Sleep -Seconds (45 * $i)
        }
        if (-not $ok) { exit 1 }
        # (nothing new to keep when vcpkg had everything already)
        if (-not (Select-String -Path build.log -Pattern "Installing \d+/\d+" -Quiet)) { "VCPKG_UNCHANGED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
        cmake --build build-windows --config Release --parallel 10 2>&1 | Tee-Object -FilePath build.log -Append
        if ($LASTEXITCODE -ne 0) { exit 1 }

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-windows.zip
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        # The job logs aren't always reachable, so the compiler errors also go into an annotation
        if [ -f build.log ]; then
          msg=$(grep -E -i -A4 "error|undefined reference|unresolved external|FAILED:" build.log | grep -v -i "werror\|-Wno-error" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"
        fi
    - name: Unzip package
      run: Expand-Archive -Path _packages/soh-windows.zip -DestinationPath soh-windows
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows
        path: soh-windows
    - name: Trim VCPKG folder
      if: ${{ always() && github.ref_name == github.event.repository.default_branch && env.VCPKG_UNCHANGED != '1' && hashFiles('vcpkg/.vcpkg-root') != '' }}
      shell: bash
      run: rm -rf vcpkg/buildtrees vcpkg/packages
    - name: Save Cache VCPKG folder
      if: ${{ always() && github.ref_name == github.event.repository.default_branch && env.VCPKG_UNCHANGED != '1' && hashFiles('vcpkg/.vcpkg-root') != '' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg
